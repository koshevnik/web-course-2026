<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-list</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script> 
</head>
<body>
    <div class="todo-container">
        <h1>Список задач</h1>

        
        <div class="todo-form">
            <input type="text" id="task-input" placeholder="Введите новую задачу...">
            <button id="add-btn">Добавить</button>
        </div>

        
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Завершённые</button>
        </div>

        
        <ul id="task-list"></ul>

        
        <div class="task-counter">
            <span id="active-count">Осталось: 0</span> | 
            <span id="completed-count">Выполнено: 0</span>
        </div>
    </div>
</body>
</html>
