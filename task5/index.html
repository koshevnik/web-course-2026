<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игра Simon (Симон говорит)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>Simon Game</h1>

    <div class="status-panel">
      <div class="level-display">Уровень: <span id="level-count">0</span></div>
      <div id="message" class="message">Нажмите «Старт», чтобы начать</div>
    </div>

    <!-- Игровое поле: сетка 2x2 / круг из 4 секторов -->
    <div class="board">
      <button class="btn btn-red" data-id="0" aria-label="Красный"></button>
      <button class="btn btn-blue" data-id="1" aria-label="Синий"></button>
      <button class="btn btn-yellow" data-id="2" aria-label="Желтый"></button>
      <button class="btn btn-green" data-id="3" aria-label="Зеленый"></button>
    </div>

    <div class="controls">
      <button id="start-btn" class="start-btn">Старт</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
